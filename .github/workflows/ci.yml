name: Verify ScoutBankAI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - run: scoutbankai demo --directory "$RUNNER_TEMP/scoutbankai-demo"
      - run: scoutbankai check --config "$RUNNER_TEMP/scoutbankai-demo/config.json"
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm ci
        working-directory: tests/ui
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: npm test
        working-directory: tests/ui
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install . pip-audit==2.10.1
      - run: python -m pip_audit --progress-spinner off
